[project]
name = "dubpoc"
version = "0.1.0"
description = "Oyun replikleri için Türkçe AI dublaj POC'si (orchestrator, core ortamı)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "numpy>=1.26",
    "soundfile>=0.12",
    "soxr>=0.3",
    "pyloudnorm>=0.1.1",
    "jiwer>=3.0",
    "jinja2>=3.1",
    "anthropic>=0.70",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pedalboard>=0.9.6",   # Rubber Band R3 time-stretch + limiter (harici rubberband.exe gerekmez)
    "imageio-ffmpeg>=0.5", # sistemde ffmpeg yoksa paketli ffmpeg.exe
]

[project.optional-dependencies]
# ASR ve QA-WER aynı core ortamında ama ayrı bir worker süreci olarak çalışır.
asr = [
    "faster-whisper>=1.1",
    "nvidia-cublas-cu12>=12.4",
    "nvidia-cudnn-cu12>=9.1,<10",
]
dev = ["pytest>=8"]

[project.scripts]
dubpoc = "dubpoc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dubpoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
